name: Reindex embeddings and deploy

# Keeps /ask's embeddings index (src/rag/data/embeddingsIndex.json) in sync
# with the mastery content repo. See antonio/mastery-bot/04-rag-ask.md in
# that repo for why the index is precomputed and committed rather than built
# live: embedding the whole knowledge base on every chat request would be
# slow and wasteful.
#
# Event-driven, not polled: mastery-bot itself calls the Actions API to
# dispatch this workflow the instant a /save write/delete/revert actually
# changes content (see GitHubContentWriter's onContentChanged and
# botInstance.ts) — no cron, no full-repo checkout+rebuild running every 30
# minutes against nothing. This requires GITHUB_TOKEN (the same token /save
# already uses for contents:write on the mastery repo) to ALSO have
# Actions: write permission on this repo (mastery-bot) — a fine-grained PAT
# needs both repos added with those two permissions; a classic PAT with
# repo+workflow scope already covers it.
#
# The only remaining manual case is editing the mastery repo directly
# outside the bot — use "Run workflow" below for that.
on:
  workflow_dispatch: {} # manual "run now" from the Actions tab, or via the Actions API (see above)

permissions:
  contents: write # to commit+push the rebuilt index back to this repo

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mastery-bot
        uses: actions/checkout@v4

      - name: Checkout mastery content repo
        uses: actions/checkout@v4
        with:
          repository: AnLuk13/mastery
          # Read-only PAT scoped to just the mastery repo (Contents: read).
          # Add it as a repo secret named CONTENT_REPO_TOKEN before enabling
          # this workflow — see antonio/mastery-bot/04-rag-ask.md.
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: mastery-content

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the embeddings index
        env:
          CONTENT_ROOT: ${{ github.workspace }}/mastery-content
        run: npx tsx scripts/buildEmbeddingsIndex.ts

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/rag/data/embeddingsIndex.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push the updated index
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/rag/data/embeddingsIndex.json
          git commit -m "Rebuild embeddings index (automated)"
          git push

      - name: Trigger a Vercel production deploy
        if: steps.diff.outputs.changed == 'true'
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

      # A deploy hook is fire-and-forget: it kicks off a build but doesn't
      # wait for or report on the result. A bad deploy going live silently
      # for up to 30 minutes (until the next scheduled run happens to
      # overwrite it) is exactly what happened once already — this makes
      # that loud instead of silent by polling the live webhook route until
      # it's healthy (a GET is expected to 405, meaning the function booted
      # and handled the request; anything else — including a hung/500
      # deployment — means it isn't) or failing the job after a bounded
      # wait, which surfaces as a normal GitHub Actions failure
      # notification. It does not attempt to auto-rollback: see
      # antonio/mastery-bot/08-lessons-and-bugs.md for the manual rollback
      # steps (`vercel rollback <known-good-url>`), which are fast and don't
      # need a broader, more sensitive Vercel API token than this workflow
      # already has.
      - name: Verify the new deployment is healthy
        if: steps.diff.outputs.changed == 'true'
        run: |
          for i in $(seq 1 18); do
            sleep 10
            status=$(curl -s -o /dev/null -w "%{http_code}" https://mastery-bot.vercel.app/api/telegram/webhook)
            echo "Attempt $i: GET /api/telegram/webhook -> $status"
            if [ "$status" = "405" ]; then
              echo "Healthy (405 Method Not Allowed on GET is the expected response)."
              exit 0
            fi
          done
          echo "::error::The new deployment did not become healthy within 3 minutes (last status: $status). It is likely live and broken right now — see antonio/mastery-bot/08-lessons-and-bugs.md for how to roll back manually."
          exit 1
